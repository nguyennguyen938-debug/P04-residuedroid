# Test 6 main run on the Device Farm phone, job 2 of 2 (artifact/plans/test6-card.md): lifecycle k 10-19 only
# (pending, kill, revoke; matched variant set, --timeout 90, seed test6-20261119), fresh log dir. Receiver mode A.
version: 0.1
android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use python 3.12
      - python3 --version
      - adb version
  pre_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID reverse tcp:8798 tcp:8798
      - adb -s $DEVICEFARM_DEVICE_UDID reverse tcp:8799 tcp:8799
      - adb -s $DEVICEFARM_DEVICE_UDID reverse tcp:8787 tcp:8787
      - adb -s $DEVICEFARM_DEVICE_UDID reverse --list
      - adb -s $DEVICEFARM_DEVICE_UDID shell getprop ro.build.fingerprint
  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - ADB=adb python3 artifact/followup/campaign.py --serial $DEVICEFARM_DEVICE_UDID --no-root --sink-host 127.0.0.1 --port 8787 --variants menqueue,mstart,mlayer,mfence,mboth --apkdir fixture/build/revision-apk --timeout 90 --schedules pending,kill,revoke --start 10 --trials 10 --seed test6-20261119 --out $DEVICEFARM_LOG_DIR/life; echo "LIFE_EXIT=$?"
  post_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID reverse --remove-all

artifacts:
  - $DEVICEFARM_LOG_DIR
