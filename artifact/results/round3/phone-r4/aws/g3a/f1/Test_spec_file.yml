# Round 4 on AWS Device Farm: G3a commit-point race (card ../../card-g3a-phone.md, adapted by B for Device Farm).
# Receiver mode B: receiver_b.py on EC2 (54.186.50.117) shapes the phone's upload; the harness runs on the Device Farm host and calls
# the EC2 control API (port 8800 must accept the Device Farm host, see ../README.md). Generated by make_spec.sh.
# --modes early,close,close2,fence,fence-abort --start 0 --trials 3 --durations calib/calibration.json = "--calibrate 3" (pilot) or "--modes early,close,close2,fence,fence-abort --start K --trials N
#             --durations calib/calibration.json" (one job per block range).
version: 0.1
android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use python 3.12
      - python3 --version
      - adb version
  pre_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID shell getprop ro.build.fingerprint
      # Device Farm pre-installs the uploaded app; race_suite installs it itself (Test 6 lesson on Android 17)
      - adb -s $DEVICEFARM_DEVICE_UDID uninstall org.residuelab.tls; echo "UNINSTALL_TLS_EXIT=$?"
      - curl -s -m 5 -o /dev/null -w "EC2_CONTROL_HTTP=%{http_code}\n" http://54.186.50.117:8800/ || echo "EC2_CONTROL_UNREACHABLE"
  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - P04_TOKEN=$(cat secrets/p04_token) ADB=adb python3 artifact/followup/race_suite.py --serial $DEVICEFARM_DEVICE_UDID --no-root --receiver http://54.186.50.117:8800 --host 54.186.50.117 --certdir cert --apk artifact/fixture/build/g3-apk/rl-tls.apk --g3 --warm-revision --sndbuf 16384 --seed g3a-df-20261125 --modes early,close,close2,fence,fence-abort --start 0 --trials 3 --durations calib/calibration.json --out $DEVICEFARM_LOG_DIR/g3a; echo "G3A_EXIT=$?"
  post_test:
    commands:
      - adb -s $DEVICEFARM_DEVICE_UDID uninstall org.residuelab.tls || true

artifacts:
  - $DEVICEFARM_LOG_DIR
